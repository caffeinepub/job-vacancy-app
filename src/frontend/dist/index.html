      #native-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;

        flex-direction: column;
        align-items: center;

        overflow: hidden;
        animation: nativeSplashIn 0.35s ease-out forwards;
      }
      @keyframes nativeSplashIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes nativeSplashOut {
        from { opacity: 1; }
        to   { opacity: 0; }
      }
      #native-splash.hiding {
        animation: nativeSplashOut 0.4s ease-in forwards;
        pointer-events: none;
      }
      #native-splash-glow1 {
        position: absolute;
        top: 20%;

    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var SW_CODE = `
const CACHE_NAME = 'jobfinder-v15';
const STATIC_ASSETS = [
  '/',
  '/manifest.json',
  '/assets/generated/pwa-icon-192.dim_192x192.png',
  '/assets/generated/pwa-icon-512.dim_512x512.png',
  '/assets/uploads/1773855575468-1.png',
];

self.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'SKIP_WAITING') {
    self.skipWaiting();
  }
});

self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) =>
      Promise.allSettled(
        STATIC_ASSETS.map((url) =>
          fetch(url, { credentials: 'same-origin' })
            .then((res) => { if (res && res.ok) return cache.put(url, res); })
            .catch(() => {})
        )
      )
    ).then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys()
      .then((keys) =>
        Promise.all(
          keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))
        )
      )
      .then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  const { request } = event;
  const url = new URL(request.url);

  if (request.method !== 'GET' || url.origin !== self.location.origin) return;
  if (url.pathname.startsWith('/api/')) {
    event.respondWith(fetch(request));
    return;
  }

  if (request.mode === 'navigate') {
    event.respondWith(
      fetch(request)
        .then((response) => {
          if (response && response.status === 200) {
            const clone = response.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(request, clone));
          }
          return response;
        })
        .catch(() =>
          caches.match('/').then((cached) => cached || caches.match(request))
        )
    );
    return;
  }

  event.respondWith(
    caches.match(request).then((cached) => {
      if (cached) return cached;
      return fetch(request).then((response) => {
        if (response && response.status === 200 && response.type !== 'opaque') {
          const clone = response.clone();
          caches.open(CACHE_NAME).then((cache) => cache.put(request, clone));
        }
        return response;
      }).catch(() => new Response('', { status: 408, statusText: 'Offline' }));
    })
  );
});
`;

        function registerBlobSW() {
