    <!--
      PWA Manifest — served at /manifest.json
      The manifest is emitted as a Rollup build artifact (not a public/ copy)
      so Caffeine's deployment pipeline includes it in the ICP asset canister.
      A second copy at /assets/manifest.json is kept for backward compatibility.
    -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      Capture beforeinstallprompt as early as possible, before React mounts.
      Chrome can fire this very early and a late-registered listener misses it.
    -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('jf-pwa-ready'));
        console.log('[PWA] beforeinstallprompt captured early');
      });
    </script>

  <body>
    <div id="root"></div>

    <!--
      Service Worker — Blob URL approach
      ====================================
      The Caffeine deployment pipeline does NOT upload public/-root files
      (sw.js) to the ICP asset canister; those routes fall back to index.html
      and Chrome rejects them. We work around this by inlining the entire SW
      code here as a JS template literal, creating a Blob, and registering
      the resulting blob: URL.

      Why a blob: URL works for scope /:
        A blob URL has the form  blob:https://example.com/<uuid>
        Its path component is just  /<uuid>  (no subdirectory).
        The Service Worker spec defines the default scope as the
        "directory" of the script URL, which for /<uuid> is /.
        So Chrome gives the SW full-origin scope with no extra headers.
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var SW_CODE = `
const CACHE_NAME = 'jobfinder-v10';
const STATIC_ASSETS = [
  '/',
  '/manifest.json',
  '/assets/generated/pwa-icon-512x512.dim_512x512.png',
];

self.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'SKIP_WAITING') {
    self.skipWaiting();
  }
});

self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) =>
      Promise.allSettled(
        STATIC_ASSETS.map((url) =>
          fetch(url, { credentials: 'same-origin' })
            .then((res) => { if (res && res.ok) return cache.put(url, res); })
            .catch(() => {})
        )
      )
    ).then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys()
      .then((keys) =>
        Promise.all(
          keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))
        )
      )
      .then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  const { request } = event;
  const url = new URL(request.url);

  if (request.method !== 'GET' || url.origin !== self.location.origin) return;
  if (url.pathname.startsWith('/api/')) {
    event.respondWith(fetch(request));
    return;
  }

  if (request.mode === 'navigate') {
    event.respondWith(
      fetch(request)
        .then((response) => {
          if (response && response.status === 200) {
            const clone = response.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(request, clone));
          }
          return response;
        })
        .catch(() =>
          caches.match('/').then((cached) => cached || caches.match(request))
        )
    );
    return;
  }

  event.respondWith(
    caches.match(request).then((cached) => {
      if (cached) return cached;
      return fetch(request).then((response) => {
        if (response && response.status === 200 && response.type !== 'opaque') {
          const clone = response.clone();
          caches.open(CACHE_NAME).then((cache) => cache.put(request, clone));
        }
        return response;
      }).catch(() => new Response('', { status: 408, statusText: 'Offline' }));
    })
  );
});
`;

        function registerBlobSW() {
          try {
            var blob = new Blob([SW_CODE], { type: 'text/javascript' });
            var blobUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(blobUrl, { scope: '/' })
              .then(function (reg) {
                console.log('[PWA] SW registered via blob URL, scope:', reg.scope);
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                reg.addEventListener('updatefound', function () {
                  var newSW = reg.installing;
                  if (newSW) {
                    newSW.addEventListener('statechange', function () {
                      if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                        newSW.postMessage({ type: 'SKIP_WAITING' });
                      }
                    });
                  }
                });
              })
              .catch(function (blobErr) {
                console.warn('[PWA] Blob SW failed, trying /sw.js fallback:', blobErr);
                return navigator.serviceWorker.register('/sw.js', { scope: '/' })
                  .then(function (r) { console.log('[PWA] /sw.js registered, scope:', r.scope); })
                  .catch(function (e) { console.warn('[PWA] SW registration failed entirely:', e); });
              });
          } catch (e) {
            console.warn('[PWA] Blob creation failed:', e);
          }
        }

        if (document.readyState === 'loading') {
          window.addEventListener('load', registerBlobSW);
        } else {
          registerBlobSW();
        }
      })();
    </script>
  </body>
</html>
