<html lang="en">
  <head>

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="JobFinder" />
    <meta name="application-name" content="JobFinder" />
    <meta name="msapplication-TileColor" content="#0D47A1" />

    <link rel="manifest" href="/manifest.json" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/generated/icon-192.dim_192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/generated/icon-512.dim_512x512.png" />
    <link rel="apple-touch-icon" href="/assets/generated/icon-512.dim_512x512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="JobFinder" />
    <meta property="og:description" content="Find the latest government and private job vacancies easily." />
    <meta property="og:image" content="/assets/generated/icon-512.dim_512x512.png" />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('jf-pwa-ready'));
        console.log('[PWA] beforeinstallprompt captured early');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var SW_CODE = `
const CACHE_NAME = 'jobfinder-v12';
const STATIC_ASSETS = [
  '/',
  '/manifest.json',
  '/assets/generated/icon-192.dim_192x192.png',
  '/assets/generated/icon-512.dim_512x512.png',
];

self.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'SKIP_WAITING') {
    self.skipWaiting();
  }
});

self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) =>
      Promise.allSettled(
        STATIC_ASSETS.map((url) =>
          fetch(url, { credentials: 'same-origin' })
            .then((res) => { if (res && res.ok) return cache.put(url, res); })
            .catch(() => {})
        )
      )
    ).then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys()
      .then((keys) =>
        Promise.all(
          keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))
        )
      )
      .then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', (event) => {
  const { request } = event;
  const url = new URL(request.url);

  if (request.method !== 'GET' || url.origin !== self.location.origin) return;
  if (url.pathname.startsWith('/api/')) {
    event.respondWith(fetch(request));
    return;
  }

  if (request.mode === 'navigate') {
    event.respondWith(
      fetch(request)
        .then((response) => {
          if (response && response.status === 200) {
            const clone = response.clone();
            caches.open(CACHE_NAME).then((cache) => cache.put(request, clone));
          }
          return response;
        })
        .catch(() =>
          caches.match('/').then((cached) => cached || caches.match(request))
        )
    );
    return;
  }

  event.respondWith(
    caches.match(request).then((cached) => {
      if (cached) return cached;
      return fetch(request).then((response) => {
        if (response && response.status === 200 && response.type !== 'opaque') {
          const clone = response.clone();
          caches.open(CACHE_NAME).then((cache) => cache.put(request, clone));
        }
        return response;
      }).catch(() => new Response('', { status: 408, statusText: 'Offline' }));
    })
  );
});
`;

        function registerBlobSW() {
          try {
            var blob = new Blob([SW_CODE], { type: 'text/javascript' });
            var blobUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(blobUrl, { scope: '/' })
              .then(function (reg) {
                console.log('[PWA] SW registered via blob URL, scope:', reg.scope);
                if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                reg.addEventListener('updatefound', function () {
                  var newSW = reg.installing;
                  if (newSW) {
                    newSW.addEventListener('statechange', function () {
                      if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                        newSW.postMessage({ type: 'SKIP_WAITING' });
                      }
                    });
                  }
                });
              })
              .catch(function (blobErr) {
                console.warn('[PWA] Blob SW failed, trying /sw.js fallback:', blobErr);
                return navigator.serviceWorker.register('/sw.js', { scope: '/' })
                  .then(function (r) { console.log('[PWA] /sw.js registered, scope:', r.scope); })
                  .catch(function (e) { console.warn('[PWA] SW registration failed entirely:', e); });
              });
          } catch (e) {
            console.warn('[PWA] Blob creation failed:', e);
          }
        }

        if (document.readyState === 'loading') {
          window.addEventListener('load', registerBlobSW);
        } else {
          registerBlobSW();
        }
      })();
    </script>
  </body>
</html>
